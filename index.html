/* ★キャンバス（★Pythonから draw()/show() で触れる） */
const cv = $("#cv"), ctx = cv.getContext("2d");
let img = null;
window.__draw = (x, y, r, g, b) => {
  if (!img) img = ctx.createImageData(cv.width, cv.height);
  if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return;
  const i = (y * cv.width + x) * 4;
  img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
};

/* ═══════════ ★Ruby 3.4（ruby.wasm）═══════════
   ★29MBあるので★最初は読まない。★Rubyで実行が押された時に初めて取りに行く。
   ★★出力は WASI 経由で console に出てしまうので、
     ★Ruby側で $stdout を StringIO に差し替えて .string を返してもらう。 */
let rb = null, rb待ち = null;

async function ruby用意(){
  if (rb) return rb;
  if (rb待ち) return rb待ち;
  rb待ち = (async () => {
    st.textContent = "Ruby を読み込み中…(29MB)"; st.className = "status load";
    const r = await fetch("./ruby/ruby.wasm");
    const mod = await WebAssembly.compileStreaming(r);
    const { vm } = await window["ruby-wasm-wasi"].DefaultRubyVM(mod);
    /* ★Rubyからキャンバスを触れるようにする（★Pythonと同じ draw/show） */
    vm.eval(`require 'js'
def draw(x, y, r, g, b)
  JS.global[:window].__draw(x.to_i, y.to_i, r.to_i, g.to_i, b.to_i)
end
def show
  JS.global[:window].__show
end`);
    rb = vm;
    return vm;
  })();
  return rb待ち;
}

/* ★★Rubyのコードの渡し方（2026-09-03 実測で作り直した）
   ★文字列リテラルで渡すと壊れる：
     ・#{} を逃がすと★展開されなくなる／逃がさないと★任意展開される
     ・" ' \\ 改行 のどれか一つでも★組み合わせで破れる
   ★★だからリテラルをやめて★UTF-8のバイト列で渡す。
     ★これなら中身が何であっても★絶対に壊れない。 */
function rubyバイト列(src){
  const b = new TextEncoder().encode(src);
  return "[" + Array.from(b).join(",") + "]";
}

async function ruby実行(src){
  const vm = await ruby用意();
  /* ★$stdout を StringIO にすげ替えて、★最後に .string を返してもらう
     ★★エラー表示に★バッククォートを使わない（★Rubyでは★コマンド実行になる） */
  const wrapped = [
    "require 'stringio'",
    "_ak_old = $stdout",
    "$stdout = StringIO.new",
    "_ak_src = " + rubyバイト列(src)
        + ".pack('C*').force_encoding('UTF-8')",
    "begin",
    "  eval(_ak_src, TOPLEVEL_BINDING, '(akatsuki)')",
    "rescue Exception => _e",
    "  $stdout.puts(_e.class.to_s + ': ' + _e.message.to_s)",
    "end",
    "_ak_out = $stdout.string",
    "$stdout = _ak_old",
    "_ak_out",
  ].join("\n");
  return vm.eval(wrapped).toString();
}

async function run() {

    try { await py.runPythonAsync(src); } catch (e) { err = String(e); }

    catch (e) { err = String(e); }
  }
  const dt = (performance.now() - t0) / 1000;
  out.textContent = "";
  if (buf) out.appendChild(document.createTextNode(buf));
  if (err) {
    const s = document.createElement("span");
    s.className = "err";
    s.textContent = "\n" + err.split("\n").slice(-6).join("\n");
    out.appendChild(s);
  }
  if (!buf && !err) {
    const s = document.createElement("span");
    s.className = "note"; s.textContent = "（何も出ませんでした）";
    out.appendChild(s);
  }
  meta.textContent = dt.toFixed(2) + "秒 ／ " + (buf.split("\n").length - 1) + "行";
  $("#run").disabled = false;
}

$("#run").onclick = run;
$("#run").disabled = true;
$("#clear").onclick = () => { $("#code").value = ""; };
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
});

/* ═══════════ ★みんなで同じ画面（2026-09-03）═══════════
   ★Hikârư：「1個の画面をみんなで操作」「ぞんばさんのもおれがみれる、もうひとりもいるけど」

   ★★Discord公式にこう書いてある（★憶測ではない）：
     「any info ... must be shared via your application's server」
     「The instanceId should be used as a key to save and load the shared data」
   ★★★＝SDKだけでは参加者どうしにデータを配れない。
     だから自前のサーバー（_server/sync.py）へ WebSocket で繋ぐ。

   ★繋ぎ先
     Discordの中 → /sync/ws （★URLマッピングで転送。★同一オリジン＝CSPに当たらない）
     ブラウザ     → sync.json に書いたURL（★Discordを開かずに試せる）
*/
let 糸 = null, 自分 = "", 受信中 = false;
const linkEl = $("#link"), peersEl = $("#peers");

function 顔ぶれを出す(names){
  peersEl.textContent = "";
  (names || []).forEach(n => {
    const d = document.createElement("span");
    d.className = "peer" + (n === 自分 ? " me" : "");
    d.textContent = n;
    peersEl.appendChild(d);
  });
}

function 送る(o){
  if (糸 && 糸.readyState === 1) 糸.send(JSON.stringify(o));
}

function タブを押す(lang){
  const b = document.querySelector('#tabs button[data-lang="' + lang + '"]');
  if (b) b.click();
}

function 同期をつなぐ(base, room, name){
  自分 = name;
  const u = base + "/ws?room=" + encodeURIComponent(room)
                 + "&name=" + encodeURIComponent(name);
  linkEl.textContent = "つないでいます…";
  linkEl.className = "link off";
  糸 = new WebSocket(u);

  糸.onopen  = () => { linkEl.textContent = "みんなと同じ画面"; linkEl.className = "link on"; };
  糸.onclose = () => { linkEl.textContent = "ひとりで"; linkEl.className = "link off";
                       peersEl.textContent = ""; 糸 = null; };
  糸.onerror = () => { linkEl.textContent = "つながりませんでした"; };

  糸.onmessage = ev => {
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    受信中 = true;                       /* ★受け取った変更を★送り返さない */
    try {
      if (d.t === "init"){
        顔ぶれを出す(d.names);
        const S = d.state || {};
        if (S.lang && S.lang !== LANG) タブを押す(S.lang);
        if (S.code != null) $("#code").value = S.code;
        if (S.out) { out.textContent = S.out; meta.textContent = S.meta || ""; }
      }
      else if (d.t === "who") 顔ぶれを出す(d.names);
      else if (d.t === "code"){
        if (d.lang && d.lang !== LANG) タブを押す(d.lang);
        $("#code").value = d.code;
      }
      else if (d.t === "lang") タブを押す(d.lang);
      else if (d.t === "run") run();      /* ★誰かが押したら全員の画面で走る */
      else if (d.t === "out"){
        out.textContent = d.out;
        meta.textContent = (d.meta || "") + "（" + d.by + "）";
      }
    } finally { 受信中 = false; }
  };
}

/* ★書いたら送る（★打つたびに送らず、300ms止まってから送る） */
let 打鍵 = null;
$("#code").addEventListener("input", () => {
  if (受信中) return;
  clearTimeout(打鍵);
  打鍵 = setTimeout(() => 送る({ t: "code", code: $("#code").value, lang: LANG }), 300);
});

/* ★お題ボタン・言語タブも配る */
nb.addEventListener("click", () => {
  if (!受信中) setTimeout(() => 送る({ t: "code", code: $("#code").value, lang: LANG }), 0);
});
$("#tabs").addEventListener("click", () => {
  if (!受信中) setTimeout(() => 送る({ t: "lang", lang: LANG }), 0);
});

/* ★実行が終わったら出力を配る（★run() を包む） */
const _run元 = run;
run = async function(){
  await _run元();
  if (!受信中) 送る({ t: "out", out: out.textContent, meta: meta.textContent });
};
$("#run").onclick = () => { if (!受信中) 送る({ t: "run" }); run(); };

/* ═══ ★立ち上がり ═══ */
(async () => {
  const Activityの中 = /discordsays\.com|\/\.proxy\//.test(location.href)
                    || location.search.includes("frame_id");

  if (Activityの中){
    try {
      const m = await import("https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.9.0/+esm");
      const sdk = new m.DiscordSDK(
        new URLSearchParams(location.search).get("client_id") || "");
      await sdk.ready();
      $("#who").textContent = "Discord Activity";
      /* ★★instanceId が★部屋の鍵。★同じVCの人だけ同じ値になる */
      const room = sdk.instanceId || "solo";
      const name = "だれか" + String(Math.random()).slice(2, 5);
      同期をつなぐ((location.protocol === "https:" ? "wss://" : "ws://")
                 + location.host + "/sync", room, name);
    } catch (e) { linkEl.textContent = "ひとりで"; }
    return;
  }

  /* ★普通のブラウザ：sync.json があればそこへ繋ぐ（★Discordを開かずに試せる） */
  try {
    const j = await (await fetch("./sync.json", { cache: "no-store" })).json();
    if (j && j.url){
      const q = new URLSearchParams(location.search);
      const room = q.get("room") || "labo";
      const name = q.get("name") || ("だれか" + String(Math.random()).slice(2, 5));
      同期をつなぐ(j.url.replace(/^http/, "ws").replace(/\/$/, ""), room, name);
    }
  } catch (e) { /* ★sync.json が無ければ ひとりで */ }
})();
