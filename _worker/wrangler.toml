name = "akatsuki-lab-sync"
main = "worker.js"
compatibility_date = "2026-09-01"

# ★★Durable Object＝「部屋」。★同じ instanceId の人が同じ所に集まる
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# ★無料プランでは new_sqlite_classes を使う（★new_classes は有料プラン専用）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
